name: Source effective selection remediation

on:
  push:
    branches:
      - fix/source-effective-selection-cli-20261026

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply focused remediation
        run: python .github/source_effective_selection_fix.py

      - name: Install focused test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused regression tests
        run: pytest -q tests/test_source_effective_selection_cli.py tests/test_canonical_ingestion.py tests/test_m01_cli.py

      - name: Validate patch
        run: |
          git diff --check
          git diff --stat

      - name: Commit validated remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/source-effective-selection-fix.yml .github/source_effective_selection_fix.py
          git add src/sgokb/cli/main.py tests/test_source_effective_selection_cli.py \
            docs/decisions/M01_OBJECT_CENTERED_CLI_CONTRACT.md \
            docs/design/SOURCE_INGESTION_PIPELINE.md \
            docs/operations/OBJECT_STANDARD_WORKFLOW.md \
            docs/operations/SGOKB_HAPPY_PATH_ACCEPTANCE_TEST_PROCEDURES.md \
            docs/operations/SGOKB_HAPPY_PATH_ACCEPTANCE_TEST_PLAN.md
          git commit -m "Expose manual source generation selection in CLI"
          git push origin HEAD:${GITHUB_REF_NAME}
