name: R2-08 candidate verification

on:
  push:
    branches:
      - r2-08-search-quality

permissions:
  contents: read

jobs:
  focused-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,mcp,vector-qdrant]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Ruff
        run: |
          ruff check src tests scripts/run_n05d04r2_search_quality_acceptance.py
          ruff format --check scripts/run_n05d04r2_search_quality_acceptance.py tests/test_n05d04r2_search_quality_acceptance.py
      - name: Focused R2-08 regression
        run: >-
          python -m pytest
          tests/test_n05d04r2_search_quality_acceptance.py
          tests/test_hybrid_search_r2.py
          tests/test_object_similarity_r2.py
          tests/test_generation_lifecycle_r2.py
          tests/test_generation_lifecycle_qdrant_r2.py
          tests/test_object_overview_r2.py
          tests/test_search_quality_gold.py
          tests/test_j02_evidence_search.py
          -q
      - name: Full regression
        run: python -m pytest -q
