name: N04G20R residual Ruff remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-n/n04g20r-ruff-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply residual E501 fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          instructions = Path("src/sgokb/exchange/instructions.py")
          text = instructions.read_text(encoding="utf-8")
          text = text.replace(
              '    return f"`{_inline(profile.class_id)}` / {_inline(profile.name)} ({_inline(profile.key)}){description}"',
              '    return (\n'
              '        f"`{_inline(profile.class_id)}` / {_inline(profile.name)} "\n'
              '        f"({_inline(profile.key)}){description}"\n'
              '    )',
          )
          text = text.replace(
              '            f"Primary ClassのRegistry意味（{meaning}）に沿って、このObjectをそのClassとして特徴付ける"',
              '            f"Primary ClassのRegistry意味（{meaning}）に沿って、"\n'
              '            "このObjectをそのClassとして特徴付ける"',
          )
          text = text.replace(
              '            f"- `{_inline(facet.facet_id)}` / {_inline(facet.name)} ({_inline(facet.key)}){description}"',
              '            f"- `{_inline(facet.facet_id)}` / {_inline(facet.name)} "\n'
              '            f"({_inline(facet.key)}){description}"',
          )

          def chunks(value: str, width: int = 42) -> list[str]:
              return [value[i : i + width] for i in range(0, len(value), width)]

          out = []
          dict_line = re.compile(r'^(\s*)"([^"]+)": "([^"]+)",$')
          string_line = re.compile(r'^(\s*)"([^"]+)"$')
          for line in text.splitlines():
              if len(line) <= 100:
                  out.append(line)
                  continue
              match = dict_line.match(line)
              if match:
                  indent, key, value = match.groups()
                  parts = chunks(value)
                  out.append(f'{indent}"{key}": (')
                  out.extend(f'{indent}    "{part}"' for part in parts)
                  out.append(f"{indent}),")
                  continue
              match = string_line.match(line)
              if match:
                  indent, value = match.groups()
                  out.extend(f'{indent}"{part}"' for part in chunks(value))
                  continue
              out.append(line)
          instructions.write_text("\n".join(out) + "\n", encoding="utf-8")

          package_transfer = Path("src/sgokb/exchange/package_transfer.py")
          text = package_transfer.read_text(encoding="utf-8")
          text = text.replace(
              '                f"Package build directory scope mismatch: missing={missing}, unexpected={unexpected}"',
              '                f"Package build directory scope mismatch: missing={missing}, "\n'
              '                f"unexpected={unexpected}"',
          )
          package_transfer.write_text(text, encoding="utf-8")

          test_file = Path("tests/test_n04_grounded_generation.py")
          text = test_file.read_text(encoding="utf-8")
          text = text.replace(
              '        == "Work A emphasizes conflict. Work B emphasizes cooperation.\\n\\nInterpretation\\nThe supplied facts describe different thematic emphases."',
              '        == "Work A emphasizes conflict. Work B emphasizes cooperation.\\n\\n"\n'
              '        "Interpretation\\nThe supplied facts describe different thematic emphases."',
          )
          test_file.write_text(text, encoding="utf-8")
          PY
          python -m pip install "ruff>=0.9,<1"
          python -m ruff format src/sgokb/exchange/instructions.py src/sgokb/exchange/package_transfer.py tests/test_n04_grounded_generation.py
      - name: Commit residual fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sgokb/exchange/instructions.py src/sgokb/exchange/package_transfer.py tests/test_n04_grounded_generation.py
          git commit -m "style: resolve residual Ruff E501 violations"
          git push origin HEAD:phase-n/n04g20r-ruff-baseline
