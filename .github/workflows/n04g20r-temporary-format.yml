name: N04G20R temporary Ruff remediation

on:
  push:
    branches:
      - phase-n/n04g20r-ruff-baseline
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-n/n04g20r-ruff-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1"
      - name: Apply Ruff remediation
        run: |
          python -m ruff format .
          python -m ruff check --fix . || true
          python -m ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: remediate repository-wide Ruff baseline"
          git push origin HEAD:phase-n/n04g20r-ruff-baseline
