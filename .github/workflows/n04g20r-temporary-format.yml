name: N04G20R final residual Ruff remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-n/n04g20r-ruff-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Split residual long literals without reformatting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/sgokb/exchange/instructions.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          def chunks(value: str, width: int = 38) -> list[str]:
              return [value[i : i + width] for i in range(0, len(value), width)]

          dict_line = re.compile(r'^(\s*)"([^"]+)": "([^"]+)",$')
          string_line = re.compile(r'^(\s*)"([^"]+)"$')
          out = []
          for line in lines:
              if len(line) <= 100:
                  out.append(line)
                  continue
              match = dict_line.match(line)
              if match:
                  indent, key, value = match.groups()
                  out.append(f'{indent}"{key}": (')
                  out.extend(f'{indent}    "{part}"' for part in chunks(value))
                  out.append(f"{indent}),")
                  continue
              match = string_line.match(line)
              if match:
                  indent, value = match.groups()
                  out.extend(f'{indent}"{part}"' for part in chunks(value))
                  continue
              out.append(line)

          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
      - name: Commit final residual fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sgokb/exchange/instructions.py
          git commit -m "style: split residual long instruction literals"
          git push origin HEAD:phase-n/n04g20r-ruff-baseline
