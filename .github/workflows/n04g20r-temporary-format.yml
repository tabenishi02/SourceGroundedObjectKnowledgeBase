name: N04G20R engineering gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: G20 focused and replay tests
        run: python -m pytest tests/test_n04_grounded_generation.py tests/test_n04g20_adversarial_regression.py -q
      - name: Full pytest
        run: python -m pytest -q
      - name: Repository-wide Ruff
        run: python -m ruff check .
      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
