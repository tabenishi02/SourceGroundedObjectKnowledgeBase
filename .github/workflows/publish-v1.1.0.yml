name: Publish SGOKB v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('pyproject.toml').read_text(encoding='utf-8')
          if 'version = "1.1.0"' not in text:
              raise SystemExit('pyproject.toml is not version 1.1.0')
          note = Path('docs/releases/v1.1.0.md')
          if not note.is_file():
              raise SystemExit('v1.1.0 release note is missing')
          acceptance = Path('docs/evaluation/SGOKB_HAPPY_PATH_ACCEPTANCE_20261028.md')
          if not acceptance.is_file():
              raise SystemExit('happy-path acceptance record is missing')
          if 'FULL SGOKB PASS' not in acceptance.read_text(encoding='utf-8'):
              raise SystemExit('happy-path acceptance record is not FULL SGOKB PASS')
          PY

      - name: Create and push immutable annotated tag
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.0 >/dev/null 2>&1; then
            git fetch --tags origin
            existing="$(git rev-parse 'v1.1.0^{commit}')"
            if [ "$existing" != "$RELEASE_SHA" ]; then
              echo "v1.1.0 already exists at $existing, expected $RELEASE_SHA" >&2
              exit 1
            fi
          else
            git tag -a v1.1.0 "$RELEASE_SHA" -m "SGOKB v1.1.0"
            git push origin refs/tags/v1.1.0
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "SGOKB v1.1.0" \
              --notes-file docs/releases/v1.1.0.md
          else
            gh release create v1.1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "SGOKB v1.1.0" \
              --notes-file docs/releases/v1.1.0.md \
              --verify-tag
          fi

      - name: Record publication bookkeeping on main
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG_OBJECT="$(git rev-parse v1.1.0)"
          TAG_TARGET="$(git rev-parse 'v1.1.0^{commit}')"
          export TAG_OBJECT TAG_TARGET
          python - <<'PY'
          import os
          from pathlib import Path

          release_sha = os.environ['RELEASE_SHA']
          tag_object = os.environ['TAG_OBJECT']
          tag_target = os.environ['TAG_TARGET']
          if tag_target != release_sha:
              raise SystemExit(f'tag target mismatch: {tag_target} != {release_sha}')

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')
          old = 'Current formal release = v1.0.0\nRelease commit = 0e1a8464e9db98b4e99169cae6292821f3fd410c'
          new = f'Current formal release = v1.1.0\nRelease commit = {release_sha}'
          if old not in text:
              raise SystemExit('root README release status block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'Release定義は [v1.0.0 Release Note](docs/releases/v1.0.0.md)',
              'Release定義は [v1.1.0 Release Note](docs/releases/v1.1.0.md)',
              1,
          )
          marker = 'Phase NはReference Workstationでのclosure audit C01-C07 PASSと独立レビューを完了しています。'
          insertion = (
              f'v1.1.0は2026-10-28のHappy-Path Operational AcceptanceでFULL SGOKB PASSを確認した後に公開した後方互換Minor releaseです。'
              f'package versionは`1.1.0`、release commitは`{release_sha}`です。\n\n'
          )
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('root README insertion marker not found')
              text = text.replace(marker, insertion + marker, 1)
          root.write_text(text, encoding='utf-8')

          docs = Path('docs/README.md')
          text = docs.read_text(encoding='utf-8')
          old = 'Current formal release = v1.0.0\nRelease commit = 0e1a8464e9db98b4e99169cae6292821f3fd410c'
          new = f'Current formal release = v1.1.0\nRelease commit = {release_sha}'
          if old not in text:
              raise SystemExit('docs README release status block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '[`releases/v1.0.0.md`](releases/v1.0.0.md) — first formal SGOKB release boundary / Breaking Changes / migration guidance',
              '[`releases/v1.1.0.md`](releases/v1.1.0.md) — current SGOKB release / happy-path acceptance-backed minor release',
              1,
          )
          docs.write_text(text, encoding='utf-8')

          index = Path('docs/releases/README.md')
          text = index.read_text(encoding='utf-8')
          old_row = '| `1.1.0` | `v1.1.0` | Release candidate — tag pending | [Release Note](v1.1.0.md) |'
          new_row = '| `1.1.0` | `v1.1.0` | Published tag verified / GitHub Release published | [Release Note](v1.1.0.md) |'
          if old_row not in text:
              raise SystemExit('v1.1.0 candidate row not found')
          text = text.replace(old_row, new_row, 1)
          pending = '`v1.1.0` becomes the current formal release only after an immutable tag is created on the frozen `main` release commit and its target is verified. Until then, `v1.0.0` remains the latest published tag.'
          published = f'`v1.1.0` is an annotated tag whose tag object is `{tag_object}` and whose target commit is `{tag_target}`.'
          if pending not in text:
              raise SystemExit('v1.1.0 pending publication note not found')
          text = text.replace(pending, published, 1)
          index.write_text(text, encoding='utf-8')
          PY

          git add README.md docs/README.md docs/releases/README.md
          if ! git diff --cached --quiet; then
            git commit -m "release: record v1.1.0 publication"
            git push origin HEAD:main
          fi
