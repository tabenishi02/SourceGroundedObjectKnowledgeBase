name: P-GUI-10 acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-gui-final-acceptance:
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vector-qdrant,gui,mcp]"
          python -m pip install numpy
          python -m pip install --no-deps sentence-transformers
      - name: Show source
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
      - name: Focused P-GUI-10 parity and usability
        shell: pwsh
        run: python -m pytest -q tests/test_p_gui_10_parity_usability_acceptance.py
      - name: Scaled DPI smoke
        shell: pwsh
        run: |
          $env:QT_SCALE_FACTOR = '1.5'
          python -m pytest -q tests/test_p_gui_10_parity_usability_acceptance.py -k scaled_dpi_layout_smoke
      - name: Full GUI regression
        shell: pwsh
        run: |
          $GuiTests = Get-ChildItem tests -Filter 'test_p_gui_*.py' | ForEach-Object { $_.FullName }
          python -m pytest -q $GuiTests
      - name: CLI and MCP regression
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_m01_cli.py `
            tests/test_source_effective_selection_cli.py `
            tests/test_n04p05_derived_cli.py `
            tests/test_j01_retrieval_mcp_boundary.py `
            tests/test_j02_mcp_read_tools.py `
            tests/test_j03_mcp_resources.py `
            tests/test_j05_mcp_write_separation.py `
            tests/test_j06_mcp_client_acceptance.py
      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests
      - name: Full repository regression
        shell: pwsh
        run: python -m pytest -q
