name: J06 Local MCP Acceptance

on:
  push:
    branches:
      - integration/knowledge-base-redesign

permissions:
  contents: read

jobs:
  windows-stdio-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with MCP SDK
        run: python -m pip install -e ".[dev,mcp]"
      - name: Show MCP version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: Ruff
        run: >-
          ruff check
          src/sgokb/mcp
          tests/j06_mcp_fixture_server.py
          tests/test_j06_mcp_client_acceptance.py
          tests/test_j05_mcp_write_separation.py
      - name: Local stdio MCP acceptance and focused regression
        run: >-
          pytest -q
          tests/test_j06_mcp_client_acceptance.py
          tests/test_j05_mcp_write_separation.py
          tests/test_j04_context_builder.py
          tests/test_j03_mcp_resources.py
          tests/test_j02_mcp_read_tools.py
          tests/test_j02_evidence_search.py
          tests/test_j01_retrieval_mcp_boundary.py
          tests/test_j01_similarity_application.py
          tests/test_j01_application_semantics.py
          tests/test_f03_object_evidence_retrieval.py
          tests/test_hybrid_search.py
          tests/test_object_similarity.py
