name: J03 Status Sync

on:
  push:
    branches:
      - integration/knowledge-base-redesign

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync J-03 documentation status
        shell: python
        run: |
          from pathlib import Path

          task_path = Path("docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md")
          task_text = task_path.read_text(encoding="utf-8")
          old = "- [ ] **J-03 [P1] MCP Resourcesを定義する**"
          new = "- [x] **J-03 [P1] MCP Resourcesを定義する**"
          if old in task_text:
              task_text = task_text.replace(old, new, 1)
          elif new not in task_text:
              raise SystemExit("J-03 task line was not found")
          marker = "  - ToolとResourceの責務重複を整理する。"
          completion = """  - **完了 (2026-10-14):** `docs/decisions/J03_MCP_RESOURCE_CONTRACT.md`を正本とし、Resourceを既知stable IDのdereference専用surfaceとして定義した。\n  - Resource Templateは`sgokb://object/{object_id}` / `sgokb://object/{object_id}/version/{version_id}` / `sgokb://evidence/{evidence_id}`の3種類。全recordを`resources/list`で列挙しない。\n  - Search / filter / batch / Relation traversal / Context selectionはTool側に残し、Resource URIへのquery parameter埋め込みを禁止した。Resource contractは`sgokb.mcp-resources.v1`。\n  - `KnowledgeReadApplication.get_evidence()`とMCP Resource Adapterを実装し、Ruff成功、J-03〜J-01 focused regressionは48 passed / 2 skipped。\n"""
          if completion.splitlines()[0] not in task_text:
              if marker not in task_text:
                  raise SystemExit("J-03 completion insertion marker was not found")
              task_text = task_text.replace(marker, marker + "\n" + completion.rstrip("\n"), 1)
          task_path.write_text(task_text, encoding="utf-8")

          status_path = Path("docs/planning/PHASE_J_STATUS.md")
          status_text = status_path.read_text(encoding="utf-8")
          status_text = status_text.replace(
              "- [ ] **J-02 [P0] MCP read toolsを定義する**",
              "- [x] **J-02 [P0] MCP read toolsを定義する**",
          )
          status_text = status_text.replace(
              "- [ ] **J-03 [P1] MCP Resourcesを定義する**",
              "- [x] **J-03 [P1] MCP Resourcesを定義する**",
          )
          start = status_text.index("J-01の設計・実装・検証記録:")
          replacement = '''J-01の設計・実装・検証記録:\n\n- `docs/decisions/J01_RETRIEVAL_MCP_APPLICATION_BOUNDARY.md`\n\nJ-02の設計・実装・検証記録:\n\n- `docs/decisions/J02_MCP_READ_TOOL_CONTRACT.md`\n\nJ-03の設計・実装・検証記録:\n\n- `docs/decisions/J03_MCP_RESOURCE_CONTRACT.md`\n\nLatest focused verification:\n\n```text\nRuff: All checks passed\nPytest: 48 passed, 2 skipped\n```\n\n## Next task\n\n```text\nJ-04 [P0] Context Builderを設計する\n```\n'''
          status_text = status_text[:start] + replacement
          status_path.write_text(status_text, encoding="utf-8")

          decision_path = Path("docs/decisions/J03_MCP_RESOURCE_CONTRACT.md")
          decision_text = decision_path.read_text(encoding="utf-8")
          verification_marker = "- J-01/J-02 read Tool regressionを壊さない。"
          verification_result = '''\n\n検証結果:\n\n```text\nRuff: All checks passed\nPytest: 48 passed, 2 skipped\n```\n\n検証用GitHub Actions Workflowは結果確認後に削除した。'''
          if "Pytest: 48 passed, 2 skipped" not in decision_text:
              if verification_marker not in decision_text:
                  raise SystemExit("J-03 verification marker was not found")
              decision_text = decision_text.replace(
                  verification_marker,
                  verification_marker + verification_result,
                  1,
              )
          decision_path.write_text(decision_text, encoding="utf-8")
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md docs/planning/PHASE_J_STATUS.md docs/decisions/J03_MCP_RESOURCE_CONTRACT.md
          git commit -m "docs(j03): mark J-03 complete"
          git push origin HEAD:integration/knowledge-base-redesign
