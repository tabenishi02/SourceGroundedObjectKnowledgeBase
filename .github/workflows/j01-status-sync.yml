name: J01 Status Sync

on:
  push:
    branches:
      - integration/knowledge-base-redesign

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark J-01 complete
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md")
          text = path.read_text(encoding="utf-8")
          old = "- [ ] **J-01 [P0] Retrieval CoreとMCP Adapterを分離する**"
          new = "- [x] **J-01 [P0] Retrieval CoreとMCP Adapterを分離する**"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("J-01 task line was not found")
      - name: Commit status
        run: |
          if git diff --quiet -- docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md
          git commit -m "docs(j01): mark J-01 complete"
          git push origin HEAD:integration/knowledge-base-redesign
