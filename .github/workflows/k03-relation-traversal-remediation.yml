name: K03 Relation Traversal Remediation

on:
  push:
    branches:
      - remediation/k03-relation-traversal

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused pytest
        run: >-
          pytest -q
          tests/test_k03_relation_traversal_remediation.py
          tests/test_j01_retrieval_mcp_boundary.py
          tests/test_j02_mcp_read_tools.py
          tests/test_m01_cli.py
          tests/test_object_version_import.py
      - name: Ruff changed modules
        run: >-
          ruff check
          src/sgokb/retrieval/object_read.py
          src/sgokb/mcp/tool_contracts.py
          tests/test_k03_relation_traversal_remediation.py
          tests/test_j02_mcp_read_tools.py
