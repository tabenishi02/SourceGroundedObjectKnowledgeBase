name: K03 Relation Traversal Remediation

on:
  push:
    branches:
      - remediation/k03-relation-traversal

permissions:
  contents: write

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact lint-only formatting fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/sgokb/retrieval/object_read.py')
          text = path.read_text(encoding='utf-8')
          old = '                    evidence_by_version[owner_version_id] = self._evidence_by_target(owner_version_id)\n'
          new = (
              '                    evidence_by_version[owner_version_id] = self._evidence_by_target(\n'
              '                        owner_version_id\n'
              '                    )\n'
          )
          if old not in text:
              raise SystemExit('object_read.py lint target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/sgokb/mcp/tool_contracts.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '        "Knowledge Version of its own. Provide version_id to pin the read to that Object\'s accepted "\n'
          )
          new = (
              '        "Knowledge Version of its own. Provide version_id to pin the read to that Object\'s "\n'
              '        "accepted Version. Canonical Relation direction is never inverted."\n'
          )
          following = '        "Version. Canonical Relation direction is never inverted."\n'
          if old not in text or following not in text:
              raise SystemExit('tool_contracts.py lint target not found')
          text = text.replace(old, new, 1).replace(following, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/sgokb/retrieval/object_read.py src/sgokb/mcp/tool_contracts.py
            git commit -m 'Format K-03 relation traversal remediation'
            git push
          fi
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused pytest
        run: >-
          pytest -q
          tests/test_k03_relation_traversal_remediation.py
          tests/test_j01_retrieval_mcp_boundary.py
          tests/test_j02_mcp_read_tools.py
          tests/test_m01_cli.py
          tests/test_object_version_import.py
      - name: Ruff changed modules
        run: >-
          ruff check
          src/sgokb/retrieval/object_read.py
          src/sgokb/mcp/tool_contracts.py
          tests/test_k03_relation_traversal_remediation.py
          tests/test_j02_mcp_read_tools.py
