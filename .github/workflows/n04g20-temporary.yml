name: N04G20 temporary verification

on:
  push:
    branches:
      - phase-n/n04g20-adversarial-verifier-regression
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-g20-diff:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-n/n04g20-adversarial-verifier-regression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1"
      - name: Format G20 Python diff
        run: |
          python -m ruff format \
            benchmark/tools/n04g20_minicheck_benchmark.py \
            src/sgokb/grounding/output.py \
            src/sgokb/grounding/validation.py \
            tests/test_n04g20_adversarial_regression.py
          python -m ruff check --fix \
            benchmark/tools/n04g20_minicheck_benchmark.py \
            src/sgokb/grounding/output.py \
            src/sgokb/grounding/validation.py \
            tests/test_n04g20_adversarial_regression.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/tools/n04g20_minicheck_benchmark.py src/sgokb/grounding/output.py src/sgokb/grounding/validation.py tests/test_n04g20_adversarial_regression.py
          git commit -m "style(n04): format G20 verification code"
          git push origin HEAD:phase-n/n04g20-adversarial-verifier-regression

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: G20 focused and replay tests
        run: python -m pytest tests/test_n04_grounded_generation.py tests/test_n04g20_adversarial_regression.py -q
      - name: Full pytest
        run: python -m pytest -q
      - name: G20 changed-scope Ruff
        run: |
          python -m ruff check benchmark/tools/n04g20_minicheck_benchmark.py src/sgokb/grounding/output.py src/sgokb/grounding/validation.py tests/test_n04g20_adversarial_regression.py
      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD

  minicheck-roberta-large:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU benchmark runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install accelerate
          python -m pip install "minicheck @ git+https://github.com/Liyan06/MiniCheck.git@b58b9fa69acbd1015ec970fa65dd752413a053d2"
          python -m nltk.downloader punkt punkt_tab
      - name: Run MiniCheck RoBERTa-large benchmark
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python benchmark/tools/n04g20_minicheck_benchmark.py \
            --corpus benchmark/n04g20-source-fact-verifier-v1.json \
            --model roberta-large \
            --cache-dir .cache/minicheck \
            --output n04g20-minicheck-roberta-large.json
      - name: Enforce necessary G21 verifier gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("n04g20-minicheck-roberta-large.json").read_text())
          print("recommended_threshold_candidate=", report["recommended_threshold_candidate"])
          if not report["candidate_has_eligible_threshold"]:
              raise SystemExit("MiniCheck candidate has no threshold satisfying required negative FP=0 and required positives")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n04g20-minicheck-roberta-large
          path: n04g20-minicheck-roberta-large.json
          if-no-files-found: warn
