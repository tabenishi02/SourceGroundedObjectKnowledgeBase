name: P-RAW-05 remediation

on:
  push:
    branches:
      - p-raw-05-verification-remediation
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p-raw-05-verification-remediation
          fetch-depth: 0
      - name: Match reference Windows checkout semantics
        shell: pwsh
        run: |
          git config core.autocrlf true
          git checkout -f HEAD -- .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - name: Install verification dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[dev,vector-qdrant,gui,mcp]" numpy
          python -m pip install "sentence-transformers>=6.1,<7" --no-deps
      - name: Focused P-RAW and v1 exchange regression
        run: >-
          python -m pytest
          tests/test_p_raw_05_raw_grounding_v2.py
          tests/test_package_manifest.py
          tests/test_package_transfer.py
          tests/test_object_result_schema.py
          tests/test_object_analysis_instructions.py
          tests/test_result_receipt.py
          tests/test_result_validation.py
          tests/test_object_version_import.py
          tests/test_diff_review.py
          tests/test_phase_g_roundtrip.py
      - name: Migration remediation regression
        run: >-
          python -m pytest
          tests/test_embedding_space.py
          tests/test_f03_object_evidence_retrieval.py
          tests/test_hybrid_search.py
          tests/test_l05_canonical_bootstrap.py
          tests/test_m01_cli.py
          tests/test_m03_standard_workflow.py
          tests/test_search_generation_migration.py
          tests/test_versioning.py
      - name: Ruff
        run: python -m ruff check src tests
      - name: Full regression
        run: python -m pytest
