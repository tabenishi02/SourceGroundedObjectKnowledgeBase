name: P-RUNTIME-02 acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate Compose rendering
        run: |
          docker compose version
          docker compose -f runtime/qdrant/compose.yaml config

      - name: Focused P-RUNTIME-02 tests
        run: python -m pytest -q tests/test_p_runtime_02_qdrant_compose_assets.py

      - name: Ruff
        run: python -m ruff check src tests

      - name: Pull and start Qdrant
        run: |
          docker compose -f runtime/qdrant/compose.yaml pull
          docker compose -f runtime/qdrant/compose.yaml up -d --wait --wait-timeout 180
          docker compose -f runtime/qdrant/compose.yaml ps
          curl --fail --show-error --silent http://127.0.0.1:6333/readyz
          curl --fail --show-error --silent http://127.0.0.1:6333/
          docker volume inspect sgokb_qdrant_storage

      - name: Verify normal down preserves named volume and restart remains healthy
        run: |
          docker compose -f runtime/qdrant/compose.yaml down
          docker volume inspect sgokb_qdrant_storage
          docker compose -f runtime/qdrant/compose.yaml up -d --wait --wait-timeout 180
          curl --fail --show-error --silent http://127.0.0.1:6333/readyz
          docker compose -f runtime/qdrant/compose.yaml down
          docker volume inspect sgokb_qdrant_storage

      - name: Acceptance diagnostics
        if: always()
        run: |
          docker compose -f runtime/qdrant/compose.yaml ps -a || true
          docker compose -f runtime/qdrant/compose.yaml logs --tail 200 qdrant || true
          docker compose -f runtime/qdrant/compose.yaml down || true
          docker volume rm sgokb_qdrant_storage || true

  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vector-qdrant,gui,mcp]"
          python -m pip install numpy
          python -m pip install --no-deps sentence-transformers

      - name: Show source
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version

      - name: Focused P-RUNTIME-02 tests
        shell: pwsh
        run: python -m pytest -q tests/test_p_runtime_02_qdrant_compose_assets.py

      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests

      - name: Full repository regression
        shell: pwsh
        run: python -m pytest -q
