name: P-RUNTIME-04 implementation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-runtime-autostart-contract:
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vector-qdrant,gui,mcp]"
          python -m pip install numpy
          python -m pip install --no-deps sentence-transformers
      - name: Show source
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          $PSVersionTable.PSVersion
      - name: Parse P-RUNTIME-04 PowerShell harness
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'runtime/qdrant/windows/Invoke-PRuntime04Acceptance.ps1'),
            [ref]$Tokens,
            [ref]$Errors
          )
          if ($Errors.Count -gt 0) {
            $Errors | Format-List *
            exit 1
          }
      - name: Focused runtime contract regression
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_p_runtime_02_qdrant_compose_assets.py `
            tests/test_p_runtime_03_runtime_health_boundary.py `
            tests/test_p_runtime_04_windows_login_autostart.py
      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests
      - name: Full repository regression
        shell: pwsh
        run: python -m pytest -q
