name: P-GUI-09 acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-gui-acceptance:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vector-qdrant,gui,mcp]"
          python -m pip install numpy
          python -m pip install --no-deps sentence-transformers
      - name: Show source
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
      - name: Focused P-GUI-09 tests
        shell: pwsh
        run: python -m pytest -q tests/test_p_gui_09_system_maintenance.py
      - name: GUI regression
        shell: pwsh
        run: python -m pytest -q tests/test_p_gui_*.py
      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests
      - name: Full repository regression
        shell: pwsh
        run: python -m pytest -q
