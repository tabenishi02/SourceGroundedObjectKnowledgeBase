name: M01 validation

on:
  push:
    branches:
      - task/m-01-object-centered-cli

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff changed files
        run: >-
          ruff check
          src/sgokb/cli
          src/sgokb/application_admin.py
          src/sgokb/system_ops.py
          src/sgokb/storage/registry_proposal_repository.py
          src/sgokb/repository.py
          src/sgokb/storage/__init__.py
          tests/test_m01_cli.py
      - name: Focused M01 tests
        run: pytest -q tests/test_m01_cli.py
      - name: Full pytest
        run: pytest -q
