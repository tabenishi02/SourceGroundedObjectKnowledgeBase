name: M01 validation

on:
  push:
    branches:
      - task/m-01-object-centered-cli

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize remaining M01 updates
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_hybrid_search.py'): [
                  (
                      'assert repo.one("SELECT max(version) AS n FROM schema_migrations")["n"] == 16',
                      'assert repo.one("SELECT max(version) AS n FROM schema_migrations")["n"] == 17',
                  ),
              ],
              Path('tests/test_versioning.py'): [
                  (
                      'assert upgraded.one("SELECT count(*) n FROM schema_migrations")["n"] == 14',
                      'assert upgraded.one("SELECT count(*) n FROM schema_migrations")["n"] == 15',
                  ),
              ],
              Path('src/sgokb/cli/main.py'): [
                  (
                      '        elif args.domain == "mcp":\n            data = _mcp_dispatch(repository, args)\n        else:\n',
                      '        elif args.domain == "mcp":\n            _mcp_dispatch(repository, args)\n            return 0\n        else:\n',
                  ),
              ],
              Path('src/sgokb/exchange/instructions.py'): [
                  (
                      'INSTRUCTIONS_VERSION = "sgokb.object-analysis/1.0"',
                      'INSTRUCTIONS_VERSION = "sgokb.object-analysis/1.1"',
                  ),
              ],
              Path('src/sgokb/prompts/object_analysis.md'): [
                  (
                      'Do not directly change Object Registry identity or classification. If analysis suggests a better target name, alias, Primary Class, or Additional Class, place it in `registry_proposals` if the Result Schema permits that proposal. A Registry proposal is not automatically accepted Knowledge.\n',
                      '''Do not directly change Object Registry identity or classification. If analysis suggests a Registry change, place it in `registry_proposals`. A Registry proposal is not automatically accepted Knowledge; it is reviewed and applied separately by the operator.\n\nUse the following standard `payload` shapes so an accepted proposal can be applied deterministically:\n\n- `object_name`: `{"name":"New canonical name"}`\n- `object_alias`: `{"value":"Alias","language":"ja","kind":"alias"}` (`language` / `kind` may be omitted)\n- `primary_class`: `{"class_id":"class:..."}` using an existing Class ID supplied by the Package\n- `additional_class`: `{"class_id":"class:...","action":"add"}` or `action:"remove"`\n- `new_class`: `{"key":"...","name":"...","assignment_policy":"primary_allowed","description":"...","parent_class_ids":[...]}`; omit `class_id` unless a stable ID is explicitly supplied\n- `new_facet`: `{"key":"...","name":"...","description":"...","is_common":false,"class_profiles":[{"class_id":"class:...","position":0,"inherit_to_descendants":true}]}`; omit `facet_id` unless explicitly supplied\n- `new_attribute`: `{"key":"...","name":"...","value_type":"string","description":"..."}`; omit `attribute_id` unless explicitly supplied\n- `new_relation_type`: `{"key":"...","name":"...","description":"..."}`; omit `relation_type_id` unless explicitly supplied\n\nDo not invent existing Class/Object IDs. Optional fields may be omitted when unsupported by Evidence. A proposal whose required payload fields cannot be grounded should not be emitted.\n''',
                  ),
              ],
          }
          changed_paths = []
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in pairs:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed_paths.append(str(path))
          print(f'changed={changed_paths}')
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tests/test_hybrid_search.py tests/test_versioning.py src/sgokb/cli/main.py src/sgokb/exchange/instructions.py src/sgokb/prompts/object_analysis.md
            git commit -m 'docs: define registry proposal payload conventions'
            git push origin HEAD:task/m-01-object-centered-cli
            exit 0
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Ruff changed files
        run: >-
          ruff check
          src/sgokb/cli
          src/sgokb/application_admin.py
          src/sgokb/system_ops.py
          src/sgokb/storage/registry_proposal_repository.py
          src/sgokb/repository.py
          src/sgokb/storage/__init__.py
          src/sgokb/exchange/instructions.py
          tests/test_m01_cli.py
          tests/test_m01_registry_proposals.py
          tests/test_f02_standard_pipeline.py
          tests/test_f05_association_controls.py
      - name: Focused M01 tests
        run: >-
          pytest -q
          tests/test_m01_cli.py
          tests/test_m01_registry_proposals.py
          tests/test_f02_standard_pipeline.py
          tests/test_f05_association_controls.py
          tests/test_package_instructions.py
      - name: Full pytest
        run: pytest -q
