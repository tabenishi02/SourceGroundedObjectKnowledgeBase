name: J04 Apply Context Builder

on:
  push:
    branches:
      - integration/knowledge-base-redesign

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply J-04 integration
        shell: python
        run: |
          from pathlib import Path
          import re

          # retrieval public exports
          path = Path("src/sgokb/retrieval/__init__.py")
          text = path.read_text(encoding="utf-8")
          context_import = '''from .context_builder import (\n    CONTEXT_BUILDER_CONTRACT_VERSION,\n    CONTEXT_DEFAULT_MAX_CHARACTERS,\n    CONTEXT_MAX_CHARACTERS,\n    CONTEXT_MAX_OBJECTS,\n    CONTEXT_PURPOSE_PROFILES,\n    ContextBuilder,\n    ContextPurposeProfile,\n    context_facets_for_purpose,\n    context_purpose_profile,\n)\n'''
          marker = 'from .embedding import (\n'
          if context_import not in text:
              text = text.replace(marker, context_import + marker, 1)
          exports = [
              '    "CONTEXT_BUILDER_CONTRACT_VERSION",',
              '    "CONTEXT_DEFAULT_MAX_CHARACTERS",',
              '    "CONTEXT_MAX_CHARACTERS",',
              '    "CONTEXT_MAX_OBJECTS",',
              '    "CONTEXT_PURPOSE_PROFILES",',
              '    "ContextBuilder",',
              '    "ContextPurposeProfile",',
              '    "context_facets_for_purpose",',
              '    "context_purpose_profile",',
          ]
          for line in reversed(exports):
              if line not in text:
                  text = text.replace('__all__ = [\n', '__all__ = [\n' + line + '\n', 1)
          path.write_text(text, encoding="utf-8")

          # Application boundary
          path = Path("src/sgokb/application_read.py")
          text = path.read_text(encoding="utf-8")
          context_import = '''from .retrieval.context_builder import (\n    CONTEXT_DEFAULT_MAX_CHARACTERS,\n    CONTEXT_MAX_OBJECTS,\n    ContextBuilder,\n    context_facets_for_purpose,\n    context_purpose_profile,\n)\n'''
          marker = 'from .retrieval.object_read import ObjectKnowledgeReader\n'
          if context_import not in text:
              text = text.replace(marker, marker + context_import, 1)
          method_marker = '    def get_object(\n'
          method = '''    def build_context(\n        self,\n        object_ids: Iterable[str],\n        *,\n        purpose: str = "general",\n        version_ids: dict[str, str] | None = None,\n        facets: Iterable[str] | None = None,\n        max_characters: int = CONTEXT_DEFAULT_MAX_CHARACTERS,\n        include_attributes: bool | None = None,\n        include_relations: bool | None = None,\n        include_evidence_refs: bool | None = None,\n    ) -> dict:\n        \"\"\"Build deterministic purpose-scoped Knowledge context without LLM inference.\"\"\"\n\n        ids = tuple(object_ids)\n        if not ids:\n            raise KnowledgeRequestError("Context Builder requires at least one Object")\n        if len(ids) > CONTEXT_MAX_OBJECTS:\n            raise KnowledgeRequestError(\n                f"Context Builder supports at most {CONTEXT_MAX_OBJECTS} Objects"\n            )\n        if len(set(ids)) != len(ids):\n            raise KnowledgeRequestError("Context Builder object_ids must be unique")\n        version_ids = version_ids or {}\n        unknown_version_keys = sorted(set(version_ids) - set(ids))\n        if unknown_version_keys:\n            raise KnowledgeRequestError(\n                "version_ids contains Objects outside object_ids: "\n                + ", ".join(unknown_version_keys)\n            )\n\n        try:\n            profile = context_purpose_profile(purpose)\n            selected_facets = context_facets_for_purpose(purpose, facets)\n        except ValueError as exc:\n            raise KnowledgeRequestError(str(exc)) from exc\n        resolved_relations = (\n            profile.include_relations if include_relations is None else include_relations\n        )\n        resolved_evidence = (\n            profile.include_evidence_refs\n            if include_evidence_refs is None\n            else include_evidence_refs\n        )\n\n        objects = [\n            self.get_object(\n                object_id,\n                version_id=version_ids.get(object_id),\n                facets=selected_facets,\n                include_relations=resolved_relations,\n                include_evidence_refs=resolved_evidence,\n            )\n            for object_id in ids\n        ]\n        try:\n            return ContextBuilder().build(\n                objects,\n                purpose=purpose,\n                facets=facets,\n                max_characters=max_characters,\n                include_attributes=include_attributes,\n                include_relations=include_relations,\n                include_evidence_refs=include_evidence_refs,\n            )\n        except ValueError as exc:\n            raise KnowledgeRequestError(str(exc)) from exc\n\n'''
          if method not in text:
              text = text.replace(method_marker, method + method_marker, 1)
          path.write_text(text, encoding="utf-8")

          # MCP Tool contract: activate build_context with finalized J-04 schema.
          path = Path("src/sgokb/mcp/tool_contracts.py")
          text = path.read_text(encoding="utf-8")
          start = text.index('# J-04 owns deterministic context selection semantics.')
          end = text.index('\n\ndef read_tool_contracts', start)
          replacement = '''# J-04 finalizes deterministic Context Builder semantics and activates the Tool.\nBUILD_CONTEXT = MCPToolContract(\n    name="build_context",\n    title="Build SGOKB Context",\n    description=(\n        "Build deterministic purpose-scoped context from known Objects without LLM inference. "\n        "Purpose selects a fixed Facet profile; explicit facets override that profile. "\n        "A character budget limits selected Knowledge items without splitting statements."\n    ),\n    input_schema=_object_schema(\n        {\n            "object_ids": {\n                "type": "array",\n                "items": _string(),\n                "minItems": 1,\n                "maxItems": 20,\n                "uniqueItems": True,\n            },\n            "purpose": {\n                "type": "string",\n                "enum": ["general", "analysis", "comparison", "roleplay", "creative"],\n                "default": "general",\n            },\n            "version_ids": {\n                "type": ["object", "null"],\n                "additionalProperties": _string(),\n                "maxProperties": 20,\n            },\n            "facets": {"anyOf": [{"type": "null"}, _string_array(max_items=50)]},\n            "max_characters": {\n                "type": "integer",\n                "minimum": 512,\n                "maximum": 200000,\n                "default": 12000,\n            },\n            "include_attributes": {"type": ["boolean", "null"], "default": None},\n            "include_relations": {"type": ["boolean", "null"], "default": None},\n            "include_evidence_refs": {"type": ["boolean", "null"], "default": None},\n        },\n        ("object_ids",),\n    ),\n    output_schema=_envelope(\n        {\n            "type": "object",\n            "properties": {\n                "context_contract_version": {"type": "string"},\n                "purpose": {\n                    "type": "string",\n                    "enum": ["general", "analysis", "comparison", "roleplay", "creative"],\n                },\n                "selection_policy": {"type": "object"},\n                "objects": {"type": "array", "items": {"type": "object"}},\n                "budget": {"type": "object"},\n                "warnings": {"type": "array", "items": {"type": "string"}},\n            },\n            "required": [\n                "context_contract_version",\n                "purpose",\n                "selection_policy",\n                "objects",\n                "budget",\n                "warnings",\n            ],\n            "additionalProperties": False,\n        }\n    ),\n    annotations=_annotations("Build SGOKB Context"),\n)\n\nACTIVE_READ_TOOL_CONTRACTS = (\n    SEARCH_OBJECTS,\n    FIND_SIMILAR_OBJECTS,\n    GET_OBJECT,\n    GET_OBJECTS,\n    GET_OBJECT_RELATIONS,\n    GET_OBJECT_EVIDENCE,\n    SEARCH_EVIDENCE,\n    BUILD_CONTEXT,\n)\nRESERVED_READ_TOOL_CONTRACTS: tuple[MCPToolContract, ...] = ()\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          # MCP Adapter port / dispatch / delegate.
          path = Path("src/sgokb/mcp/adapter.py")
          text = path.read_text(encoding="utf-8")
          protocol_marker = '''    def get_evidence(self, evidence_id: str) -> dict: ...\n\n'''
          protocol_method = '''    def build_context(\n        self,\n        object_ids: Iterable[str],\n        *,\n        purpose: str = "general",\n        version_ids: dict[str, str] | None = None,\n        facets: Iterable[str] | None = None,\n        max_characters: int = 12000,\n        include_attributes: bool | None = None,\n        include_relations: bool | None = None,\n        include_evidence_refs: bool | None = None,\n    ) -> dict: ...\n\n'''
          if protocol_method not in text:
              text = text.replace(protocol_marker, protocol_marker + protocol_method, 1)
          dispatch_marker = '''        if name == "search_evidence":\n            return self.search_evidence(\n'''
          # Insert build_context before search_evidence dispatch only (first occurrence in _dispatch).
          dispatch_method = '''        if name == "build_context":\n            return self.build_context(\n                arguments["object_ids"],\n                purpose=arguments.get("purpose", "general"),\n                version_ids=arguments.get("version_ids"),\n                facets=arguments.get("facets"),\n                max_characters=arguments.get("max_characters", 12000),\n                include_attributes=arguments.get("include_attributes"),\n                include_relations=arguments.get("include_relations"),\n                include_evidence_refs=arguments.get("include_evidence_refs"),\n            )\n'''
          idx = text.index(dispatch_marker)
          if dispatch_method not in text[: text.index('    def search_objects(', idx)]:
              text = text[:idx] + dispatch_method + text[idx:]
          delegate_marker = '''    def get_evidence(self, evidence_id: str) -> dict:\n        return self._application.get_evidence(evidence_id)\n\n'''
          delegate_method = '''    def build_context(\n        self,\n        object_ids: Iterable[str],\n        *,\n        purpose: str = "general",\n        version_ids: dict[str, str] | None = None,\n        facets: Iterable[str] | None = None,\n        max_characters: int = 12000,\n        include_attributes: bool | None = None,\n        include_relations: bool | None = None,\n        include_evidence_refs: bool | None = None,\n    ) -> dict:\n        return self._application.build_context(\n            object_ids,\n            purpose=purpose,\n            version_ids=version_ids,\n            facets=facets,\n            max_characters=max_characters,\n            include_attributes=include_attributes,\n            include_relations=include_relations,\n            include_evidence_refs=include_evidence_refs,\n        )\n\n'''
          if delegate_method not in text:
              text = text.replace(delegate_marker, delegate_marker + delegate_method, 1)
          path.write_text(text, encoding="utf-8")

          # Update J-02 regression expectations now that reserved Tool is activated by J-04.
          path = Path("tests/test_j02_mcp_read_tools.py")
          text = path.read_text(encoding="utf-8")
          fake_marker = '''    def search_evidence(self, query, **kwargs):\n'''
          fake_method = '''    def build_context(self, object_ids, **kwargs):\n        values = tuple(object_ids)\n        self.calls.append(("build_context", values, kwargs))\n        return {\n            "context_contract_version": "sgokb.context-builder.v1",\n            "purpose": kwargs["purpose"],\n            "selection_policy": {},\n            "objects": [],\n            "budget": {},\n            "warnings": [],\n        }\n\n'''
          if fake_method not in text:
              text = text.replace(fake_marker, fake_method + fake_marker, 1)
          text = text.replace(
              '''        "search_evidence",\n    ]\n    assert "semantic_search_objects" not in names\n    assert "build_context" not in names\n''',
              '''        "search_evidence",\n        "build_context",\n    ]\n    assert "semantic_search_objects" not in names\n''',
              1,
          )
          old_test = re.compile(
              r'def test_build_context_is_reserved_for_j04_but_not_active\(\):\n.*?\n\ndef test_search_objects_uses_mode',
              re.S,
          )
          new_test = '''def test_build_context_is_active_after_j04():\n    contracts = read_tool_contracts(include_reserved=True)\n    context = next(item for item in contracts if item.name == "build_context")\n    assert context.availability == "active"\n    adapter = MCPReadAdapter(FakeReadApplication())\n    response = adapter.call_tool(\n        "build_context",\n        {"object_ids": ["obj-1"], "purpose": "general", "max_characters": 2000},\n    )\n    assert response["data"]["context_contract_version"] == "sgokb.context-builder.v1"\n\n\ndef test_search_objects_uses_mode'''
          text, count = old_test.subn(new_test, text, count=1)
          if count != 1:
              raise SystemExit("Could not replace reserved build_context J-02 test")
          path.write_text(text, encoding="utf-8")

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sgokb/retrieval/__init__.py src/sgokb/application_read.py src/sgokb/mcp/tool_contracts.py src/sgokb/mcp/adapter.py tests/test_j02_mcp_read_tools.py
          git commit -m "feat(j04): activate deterministic build_context MCP Tool"
          git push origin HEAD:integration/knowledge-base-redesign
