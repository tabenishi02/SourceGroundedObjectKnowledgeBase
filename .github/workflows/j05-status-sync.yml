name: J05 Status Sync

on:
  push:
    branches:
      - integration/knowledge-base-redesign

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync J-05 documentation status
        shell: python
        run: |
          from pathlib import Path

          task_path = Path("docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md")
          task_text = task_path.read_text(encoding="utf-8")
          old = "- [ ] **J-05 [P1] MCP write系はread系と分離する**"
          new = "- [x] **J-05 [P1] MCP write系はread系と分離する**"
          if old in task_text:
              task_text = task_text.replace(old, new, 1)
          elif new not in task_text:
              raise SystemExit("J-05 task line was not found")

          marker = "  - 将来`propose_object`等を追加する場合もstagingへ限定する。"
          completion = """  - **完了 (2026-10-14):** `docs/decisions/J05_MCP_WRITE_BOUNDARY.md`を正本とし、初期MCP MVPをread-onlyへ固定した。\n  - read / writeを別contract・別Adapter境界へ分離し、`MCPWriteAdapter`はMVPでTool 0個・全call拒否とした。\n  - future writeはproposal/staging-onlyとし、canonical direct mutation / automatic promotionを禁止した。explicit enable / authorization scope / audit recordを必須policyとした。\n  - MCP write policyは`sgokb.mcp-write-policy.v1`、将来Tool contract namespaceは`sgokb.mcp-write-tools.v1`。Ruff成功、J-05〜J-01 + Phase I focused regressionは59 passed / 2 skipped。"""
          if completion.splitlines()[0] not in task_text:
              if marker not in task_text:
                  raise SystemExit("J-05 completion insertion marker was not found")
              task_text = task_text.replace(marker, marker + "\n" + completion, 1)
          task_path.write_text(task_text, encoding="utf-8")

          status_path = Path("docs/planning/PHASE_J_STATUS.md")
          status_text = status_path.read_text(encoding="utf-8")
          status_text = status_text.replace(
              "- [ ] **J-05 [P1] MCP write系はread系と分離する**",
              "- [x] **J-05 [P1] MCP write系はread系と分離する**",
              1,
          )
          marker = '''J-04の設計・実装・検証記録:\n\n- `docs/decisions/J04_CONTEXT_BUILDER_CONTRACT.md`\n'''
          record = '''\nJ-05の設計・実装・検証記録:\n\n- `docs/decisions/J05_MCP_WRITE_BOUNDARY.md`\n'''
          if record.strip() not in status_text:
              if marker not in status_text:
                  raise SystemExit("Phase J status J-04 record marker was not found")
              status_text = status_text.replace(marker, marker + record, 1)
          status_text = status_text.replace(
              "Pytest: 55 passed, 2 skipped",
              "Pytest: 59 passed, 2 skipped",
              1,
          )
          status_text = status_text.replace(
              "```text\nJ-05 [P1] MCP write系はread系と分離する\n```",
              "```text\nJ-06 [P0] ローカルMCP Clientで受入試験する\n```",
              1,
          )
          status_path.write_text(status_text, encoding="utf-8")
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md docs/planning/PHASE_J_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(j05): mark J-05 complete"
          git push origin HEAD:integration/knowledge-base-redesign
