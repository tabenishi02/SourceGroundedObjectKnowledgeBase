name: J04 Status Sync

on:
  push:
    branches:
      - integration/knowledge-base-redesign

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync J-04 documentation status
        shell: python
        run: |
          from pathlib import Path

          task_path = Path("docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md")
          task_text = task_path.read_text(encoding="utf-8")
          old = "- [ ] **J-04 [P0] Context Builderを設計する**"
          new = "- [x] **J-04 [P0] Context Builderを設計する**"
          if old in task_text:
              task_text = task_text.replace(old, new, 1)
          elif new not in task_text:
              raise SystemExit("J-04 task line was not found")
          marker = "  - LLM推論は行わず、決定論的なKnowledge selectionを担当する。"
          completion = """  - **完了 (2026-10-14):** `docs/decisions/J04_CONTEXT_BUILDER_CONTRACT.md`を正本とし、Context BuilderをLLM推論から分離したdeterministic Knowledge selectorとして設計・実装した。\n  - `general` / `analysis` / `comparison` / `roleplay` / `creative`の固定Purpose Profileを定義し、Facet priority、attributes / relations / evidence refsの既定値を用途別に固定した。明示`facets`はprofileをoverrideする。\n  - length controlはmodel依存tokenizerを避け、selected Knowledge itemのserialized JSON character budgetを採用した。Statement途中切断を禁止し、複数Objectではequal-shareで配分する。\n  - J-02で予約していた`build_context`をactive MCP read Tool化した。Context Builder contractは`sgokb.context-builder.v1`。\n  - Ruff成功、J-04〜J-01 + Phase I focused regressionは55 passed / 2 skipped。\n"""
          if completion.splitlines()[0] not in task_text:
              if marker not in task_text:
                  raise SystemExit("J-04 completion insertion marker was not found")
              task_text = task_text.replace(marker, marker + "\n" + completion.rstrip("\n"), 1)
          task_path.write_text(task_text, encoding="utf-8")

          status_path = Path("docs/planning/PHASE_J_STATUS.md")
          status_text = status_path.read_text(encoding="utf-8")
          status_text = status_text.replace(
              "- [ ] **J-04 [P0] Context Builderを設計する**",
              "- [x] **J-04 [P0] Context Builderを設計する**",
          )
          decision_marker = '''J-03の設計・実装・検証記録:\n\n- `docs/decisions/J03_MCP_RESOURCE_CONTRACT.md`\n'''
          j04_record = '''\nJ-04の設計・実装・検証記録:\n\n- `docs/decisions/J04_CONTEXT_BUILDER_CONTRACT.md`\n'''
          if j04_record.strip() not in status_text:
              if decision_marker not in status_text:
                  raise SystemExit("Phase J status decision marker was not found")
              status_text = status_text.replace(decision_marker, decision_marker + j04_record, 1)
          status_text = status_text.replace(
              "Pytest: 48 passed, 2 skipped",
              "Pytest: 55 passed, 2 skipped",
          )
          status_text = status_text.replace(
              "J-04 [P0] Context Builderを設計する",
              "J-05 [P1] MCP write系はread系と分離する",
              1 if "## Next task" in status_text else 0,
          )
          # The first replacement above could target the checklist if used blindly; force Next task block.
          status_text = status_text.replace(
              "```text\nJ-04 [P0] Context Builderを設計する\n```",
              "```text\nJ-05 [P1] MCP write系はread系と分離する\n```",
          )
          status_path.write_text(status_text, encoding="utf-8")

          j02_path = Path("docs/decisions/J02_MCP_READ_TOOL_CONTRACT.md")
          j02_text = j02_path.read_text(encoding="utf-8")
          marker = "これによりJ-02でroleplay / comparison / analysis / creative等のFacet selection policyを先取りして固定しない。"
          followup = '''\n\n### J-04 follow-up — 2026-10-14\n\nJ-04でContext Builder policyが確定したため、`build_context`はactive read Toolへ移行した。現在のactive read Toolは8個である。正式なselection / budget contractは`docs/decisions/J04_CONTEXT_BUILDER_CONTRACT.md`を正本とする。J-02時点の7 Tool / `reserved_j04`記述はJ-02完了時点の履歴として保持する。'''
          if "### J-04 follow-up — 2026-10-14" not in j02_text:
              if marker not in j02_text:
                  raise SystemExit("J-02 follow-up marker was not found")
              j02_text = j02_text.replace(marker, marker + followup, 1)
          j02_path.write_text(j02_text, encoding="utf-8")
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md docs/planning/PHASE_J_STATUS.md docs/decisions/J02_MCP_READ_TOOL_CONTRACT.md
          git commit -m "docs(j04): mark J-04 complete"
          git push origin HEAD:integration/knowledge-base-redesign
