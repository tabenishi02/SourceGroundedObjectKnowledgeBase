name: J06 Status Sync

on:
  push:
    branches:
      - integration/knowledge-base-redesign

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync J-06 task status
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md")
          text = path.read_text(encoding="utf-8")
          old = "- [ ] **J-06 [P0] ローカルMCP Clientで受入試験する**"
          new = "- [x] **J-06 [P0] ローカルMCP Clientで受入試験する**"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("J-06 task line was not found")

          marker = "  - loopback外へ公開する場合はexplicit enable + authentication / scopeを要求する。"
          completion = """  - **完了 (2026-10-14):** `docs/decisions/J06_LOCAL_MCP_CLIENT_ACCEPTANCE.md`を正本とし、MCP Python SDK v2のlocal stdio Server bindingとWindows local Client受入試験を実施した。\n  - final fixtureは実SQLite Repository / `KnowledgeReadApplication` / Search Representation / `ExactVectorIndexAdapter`を使用し、single/batch Object read、Semantic Search、Similarity Search、Context length control、Resource dereferenceをMCP越しに確認した。\n  - MCP subprocess停止時もcanonical Application readとCLIが独立して利用可能であることを確認した。初期MVPはstdio read-onlyでnetwork listenerを持たず、将来の非loopback公開はexplicit enable + authentication / authorization scopeを必須とする。\n  - 実測環境はWindows Server 2025 / Python 3.12.10 / MCP Python SDK 2.3.0。Ruff成功、J-06〜J-01 + Phase I focused regressionは61 passed / 2 skipped。\n  - J-01〜J-06完了によりPhase J — MCP Knowledge Access Layerを完了した。"""
          if completion.splitlines()[0] not in text:
              if marker not in text:
                  raise SystemExit("J-06 completion insertion marker was not found")
              text = text.replace(marker, marker + "\n" + completion, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning/KNOWLEDGE_BASE_REDESIGN_TASKS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(j06): mark J-06 and Phase J complete"
          git push origin HEAD:integration/knowledge-base-redesign
