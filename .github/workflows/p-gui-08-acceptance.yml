name: P-GUI-08 Acceptance

on:
  push:
    branches:
      - p-gui-08-package-result-gui
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,vector-qdrant,gui,mcp]"
          python -m pip install numpy
          python -m pip install --no-deps sentence-transformers
      - name: Show source
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
      - name: P-GUI-08 focused acceptance
        shell: pwsh
        run: python -m pytest -q tests/test_p_gui_08_package_result.py
      - name: GUI regression
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests/test_p_gui_*.py | ForEach-Object { $_.FullName }
          python -m pytest -q $tests
      - name: Ruff
        shell: pwsh
        run: python -m ruff check src tests
      - name: Full repository regression
        shell: pwsh
        run: python -m pytest -q
