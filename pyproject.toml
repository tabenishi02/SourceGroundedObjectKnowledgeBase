[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-grounded-object-knowledge-base"
version = "0.2.0"
description = "Raw Web Capture to provenance-aware entity documents (prototype)"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
local-embedding = ["sentence-transformers>=3,<6"]

[project.scripts]
sgokb = "sgokb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgokb = ["migrations/*.sql", "prompts/*.md", "prompts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
