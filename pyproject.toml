[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-grounded-object-knowledge-base"
version = "0.2.0"
description = "Raw Web Capture to provenance-aware entity documents (prototype)"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
mcp = ["mcp>=2,<3"]
local-embedding = ["sentence-transformers>=6.1,<7", "transformers>=5.2,<6"]
fast-embedding = ["fastembed>=0.9,<1"]
vector-qdrant = ["qdrant-client>=1.19,<2"]

[project.scripts]
sgokb = "sgokb.cli:main"
sgokb-package = "sgokb.package_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgokb = [
  "migrations/*.sql",
  "prompts/*.md",
  "prompts/*.json",
  "exchange/schemas/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
