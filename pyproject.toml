[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "source-grounded-object-knowledge-base"
version = "1.1.0"
description = "Source-grounded, provenance-aware object knowledge base"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.27,<1", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
mcp = ["mcp>=2,<3"]
gui = ["PySide6>=6.12,<6.13"]
local-embedding = ["torch>=2.6,<3", "sentence-transformers>=6.1,<7", "transformers>=5.2,<6"]
fast-embedding = ["fastembed>=0.9,<1"]
vector-qdrant = ["qdrant-client>=1.19,<2"]

[project.scripts]
sgokb = "sgokb.cli:main"

[project.gui-scripts]
sgokb-gui = "sgokb.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgokb = [
  "migrations/*.sql",
  "prompts/*.md",
  "prompts/*.json",
  "exchange/schemas/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# benchmark/ is repository-owned support code outside the setuptools src package.
# Declare it explicitly so Ruff classifies benchmark.tools imports as first-party.
known-first-party = ["benchmark"]

[tool.ruff.lint.per-file-ignores]
# The operator module is a deliberately explicit 67-operation routing table. Keep
# R9 focused on semantic parity rather than reflowing the dispatch matrix.
"src/sgokb/application_operator.py" = ["E501", "I001"]
# These test modules intentionally re-export pytest fixtures from sibling modules;
# function parameters then consume those fixture names, which Ruff reports as F811.
"tests/test_hybrid_search_r2_semantic_fusion.py" = ["F811"]
"tests/test_object_similarity_facet_median.py" = ["F811"]
